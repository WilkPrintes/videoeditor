# macOS (Apple Silicon) build: Qt from download.qt.io, an LGPL FFmpeg built here, the tests, and the
# zip the in-app updater installs. A tag v<version> also publishes it as a GitHub release; the tag
# must match project(VERSION) in CMakeLists.txt.
name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.12.0"
  FFMPEG_VERSION: "9.0.2"

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write # only used by the release step, on tags
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and tools
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          brew install ninja

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ env.QT_VERSION }}-macos-v1

      - name: Qt ${{ env.QT_VERSION }}
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: python3 scripts/fetch_qt.py --version "$QT_VERSION" --host mac_x64 --arch clang_64 --modules qtshadertools --extract-with tar --out "$RUNNER_TEMP/Qt"

      - name: Deployment target
        run: |
          qt="$RUNNER_TEMP/Qt/$QT_VERSION/clang_64"
          test -f "$qt/lib/cmake/Qt6/Qt6Config.cmake"
          target="$(sed -n 's/^QMAKE_MACOSX_DEPLOYMENT_TARGET *= *//p' "$qt/mkspecs/common/macx.conf")"
          echo "QT_DIR=$qt" >>"$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=${target:-13.0}" >>"$GITHUB_ENV"
          echo "deployment target ${target:-13.0}"

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-lgpl-arm64-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/build-macos-ffmpeg.sh') }}

      - name: FFmpeg ${{ env.FFMPEG_VERSION }} (LGPL)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-macos-ffmpeg.sh "$RUNNER_TEMP/ffmpeg" "$FFMPEG_VERSION"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          -DCMAKE_PREFIX_PATH="$QT_DIR"
          -DFFMPEG_ROOT="$RUNNER_TEMP/ffmpeg"

      - name: Build
        run: cmake --build build

      - name: Core tests
        run: ./build/ve_core_tests

      - name: GUI tests
        continue-on-error: true # a CI virtual machine may lack the GPU or the encoder they use
        run: ./build/ve_ui_tests

      - name: Self-test (edit, save, export)
        continue-on-error: true
        run: |
          ./build/ve-cli encoders
          ./build/ve-cli make-test-clip "$RUNNER_TEMP/clip.mp4" 4 640 360 30
          ./build/ve-cli selftest "$RUNNER_TEMP/clip.mp4" "$RUNNER_TEMP/selftest.mp4"

      - name: Package
        run: |
          bash scripts/package-macos.sh build dist
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          echo "VE_VERSION=$version" >>"$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Smoke test of the packaged app
        run: |
          rm -rf "$RUNNER_TEMP/unzipped" && mkdir "$RUNNER_TEMP/unzipped"
          ditto -x -k dist/VideoEditor-*-macos-arm64.zip "$RUNNER_TEMP/unzipped"
          "$RUNNER_TEMP/unzipped/VideoEditor.app/Contents/MacOS/VideoEditor" --version

      - uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-${{ env.VE_VERSION }}-macos-arm64
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$VE_VERSION.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "VideoEditor $VE_VERSION" --notes-file "$notes"
